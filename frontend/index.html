<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio - Proyecto TELNOR</title>
  <link rel="stylesheet" href="estiloInd.css">  
</head>
<body>
  <!-- IMAGEN DE FONDO -->
  <div class="bg-image"></div>

  <div class="wrapper">
    <h1>Proyecto TELNOR</h1>
    <p>Accede con tu usuario y contraseña</p>

    <div class="panel">
      <form class="login-card" id="loginForm">
        <div>
          <label for="usuario">Selecciona tu usuario</label>
          <select id="usuario" required>
            <option value="">-- Elegir --</option>
            <option value="valeria">Valeria</option>
            <option value="christian">Christian</option>
          </select>
        </div>

        <div>
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="Ingresa tu contraseña" required />
        </div>

        <button class="btn" type="submit">Ingresar</button>
        <div class="error" id="errorMsg">Usuario o contraseña incorrectos.</div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const usuario = document.getElementById("usuario");
    const password = document.getElementById("password");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";

      const user = usuario.value;
      const pass = password.value;

      if (user === "valeria" && pass === "12345678") {
        window.location.href = "valeria-semaforo.html";
        return;
      }

      if (user === "christian" && pass === "87654321") {
        window.location.href = "christian.html";
        return;
      }

      errorMsg.style.display = "block";
    });
  </script>
</body>
</html>
