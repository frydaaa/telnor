<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inicio - Proyecto TELNOR</title>
  <style>
    :root{
      --primary:#00589C;
      --primary-light:#2d7cc2;
      --primary-dark:#003f70;
      --bg:#f1f6fb;
      --panel:#ffffff;
      --card:#f7fbff;
      --text:#0b1d2e;
      --muted:#5c738a;
      --shadow:0 18px 40px rgba(0,0,0,0.18);
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family: Arial, sans-serif;
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px 16px;
      position:relative;
      overflow:hidden;
    }

    /* IMAGEN DE FONDO */
    .bg-image{
      position:fixed;
      inset:0;
      background:url("imagenes/imggg.jpeg") center/cover no-repeat;
      filter:blur(8px) brightness(0.95);
      z-index:0;
    }

    /* Capa suave encima de la imagen */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:rgba(241,246,251,0.55);
      z-index:1;
    }

    /* Marca de agua */
    body::after{
      content:"MADE BY FRIDA, CARABEO HEBER";
      position:fixed;
      bottom:30px;
      right:20px;
      font-size:1rem;
      letter-spacing:2px;
      color:rgba(0,88,156,0.20);
      transform:rotate(-8deg);
      pointer-events:none;
      z-index:2;
    }

    .wrapper{
      width:100%;
      max-width:820px;
      text-align:center;
      position:relative;
      z-index:3;
    }

    h1{
      color:var(--primary);
      letter-spacing:1px;
      margin-bottom:10px;
      font-size:2.4rem;
    }

    p{
      color:var(--muted);
      margin-bottom:26px;
      font-size:1rem;
    }

    .panel{
      background:var(--panel);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:28px;
      border:1px solid #d5e6f7;
    }

    .login-card{
      background:var(--card);
      border-radius:18px;
      padding:22px;
      border:1px solid #dbe9f6;
      text-align:left;
      display:grid;
      gap:14px;
    }

    label{
      font-size:0.9rem;
      color:var(--muted);
    }

    select, input{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid #cfe0f1;
      background:#ffffff;
      color:var(--text);
      outline:none;
      font-size:1rem;
    }

    .btn{
      margin-top:8px;
      width:100%;
      padding:12px 18px;
      border-radius:14px;
      background:linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color:#ffffff;
      font-weight:bold;
      border:none;
      cursor:pointer;
      box-shadow:0 10px 18px rgba(0,88,156,0.25);
      transition:transform 0.2s ease, box-shadow 0.3s ease;
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 14px 24px rgba(0,88,156,0.35);
    }

    .error{
      margin-top:8px;
      font-size:0.9rem;
      color:#b42318;
      display:none;
    }
  </style>
</head>
<body>
  <!-- IMAGEN DE FONDO -->
  <div class="bg-image"></div>

  <div class="wrapper">
    <h1>Proyecto TELNOR</h1>
    <p>Accede con tu usuario y contraseña</p>

    <div class="panel">
      <form class="login-card" id="loginForm">
        <div>
          <label for="usuario">Selecciona tu usuario</label>
          <select id="usuario" required>
            <option value="">-- Elegir --</option>
            <option value="valeria">Valeria</option>
            <option value="christian">Christian</option>
          </select>
        </div>

        <div>
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="Ingresa tu contraseña" required />
        </div>

        <button class="btn" type="submit">Ingresar</button>
        <div class="error" id="errorMsg">Usuario o contraseña incorrectos.</div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const usuario = document.getElementById("usuario");
    const password = document.getElementById("password");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";

      const user = usuario.value;
      const pass = password.value;

      if (user === "valeria" && pass === "12345678") {
        window.location.href = "valeria-semaforo.html";
        return;
      }

      if (user === "christian" && pass === "87654321") {
        window.location.href = "christian.html";
        return;
      }

      errorMsg.style.display = "block";
    });
  </script>
</body>
</html>
